<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <h1>Async/Await</h1>
    <div id="user-list">
      <button id="load-users">Load Users</button>
    </div>

    <script type="module" src="./math.js">
          const student = {
          name: "Alice",
          age: 20,
      }
      const jsonText = JSON.stringify(student);
      const result = JSON.parse(jsonText);
      console.log(jsonText);
      console.log(result);

      const loadUsersButton = document.getElementById("load-users");
      loadUsersButton.addEventListener("click", async () => {
        try {
          const response = await fetch("https://jsonplaceholder.typicode.com/users");
          if (!response.ok) {
            throw new Error("Network response was not ok");
          }
          const users = await response.json();
          const userList = document.getElementById("user-list");
          const userListHtml = users.map(user => `<li>${user.name} (${user.email})</li>`).join("");
          userList.innerHTML = `<ul>${userListHtml}</ul>`;
        } catch (error) {
          console.error("Error fetching users:", error);
        }
      });
    </script>
    <script>
      async function loadUsers() {
        try {
          const response = await fetch("https://jsonplaceholder.typicode.com/users");
          if (!response.ok) {
            throw new Error("Network response was not ok");
          }
          const users = await response.json();
          console.log(users);
        } catch (error) {
          console.error("에러요", error);
        }
      }
      loadUsers();
    </script>
  </body>
</html>
