<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>동아리 회원 관리</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <h1>동아리 회원 관리 CRUD</h1>
      <h2>회원 입력</h2>
      <form id="memberForm">
        <div>
          <label for="name">이름:</label>
          <input type="text" id="name" placeholder="이름" />
        </div>
        <div>
          <label for="studentId">학번:</label>
          <input type="number" id="studentId" placeholder="학번" />
        </div>
        <div>
          <label for="gender">성별:</label>
          <select id="gender">
            <option value="성별" disabled selected>성별</option>
            <option value="남자">남자</option>
            <option value="여자">여자</option>
          </select>
        </div>
        <div>
          <label for="major">학부:</label>
          <select id="major">
            <option value="학부" disabled selected>학부</option>
            <option value="AI컴퓨터전자">AI컴퓨터전자</option>
            <option value="국제어문학부">국제어문학부</option>
            <option value="경영경제학부">경영경제학부</option>
            <option value="법학부">법학부</option>
            <option value="커뮤니케이션학부">커뮤니케이션학부</option>
            <option value="상담심리사회복지학부">상담심리사회복지학부</option>
            <option value="공간환경시스템공학부">공간환경시스템공학부</option>
            <option value="기계제어공학부">기계제어공학부</option>
            <option value="콘텐츠융합디자인학부">콘텐츠융합디자인학부</option>
            <option value="생명과학부">생명과학부</option>
            <option value="AI융합학부">AI융합학부</option>
            <option value="GLS학부">GLS학부</option>
          </select>
        </div>
        <div>
          <label for="email">이메일:</label>
          <input type="email" id="email" placeholder="이메일" />
        </div>
        <button id="addBtn" type="button" class="addBtn">저장</button>
      </form>

      <p id="message"></p>

      <h2 id="listTitle">회원 목록</h2>
      <table border="1" id="table">
        <thead>
          <tr>
            <th>ID</th>
            <th>이름</th>
            <th>학번</th>
            <th>성별</th>
            <th>학부</th>
            <th>이메일</th>
            <th>관리</th>
          </tr>
        </thead>
        <tbody id="memberList"></tbody>
      </table>
    </div>

    <script src="crud.js"></script>
  </body>
</html>
